services:
  backend:
    build:
      context: ./backend
    container_name: scic-backend
    restart: unless-stopped
    environment:
      SCIC_SECRET_KEY: ${SCIC_SECRET_KEY:-change-me-in-production-use-openssl-rand-hex-32}
      SCIC_DATABASE_URL: sqlite:////data/scic.db
      SCIC_CORS_ORIGINS: '["https://${PUBLIC_DOMAIN:-localhost}", "http://localhost:3000"]'
    volumes:
      - scic-data:/data
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: scic-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://backend:8000}
      NODE_ENV: production
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"

  # Reverse proxy avec SSL Let's Encrypt — à décommenter en production

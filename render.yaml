# Déploiement Render.com (free tier compatible)
# Pousse ce repo sur GitHub puis dans Render : "New Blueprint" → sélectionne le repo.

services:
  - type: web
    name: scic-backend
    env: docker
    plan: starter
    region: frankfurt   # datacenter européen
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: SCIC_SECRET_KEY
        generateValue: true
      - key: SCIC_CORS_ORIGINS
        value: '["https://scic-frontend.onrender.com"]'
    disk:
      name: scic-data
      mountPath: /data
      sizeGB: 1
    healthCheckPath: /api/health

  - type: web
    name: scic-frontend
    env: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://scic-backend.onrender.com
      - key: NODE_ENV
        value: production
